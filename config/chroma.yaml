# ---- 通用 RAG 配置 ----
persist_directory: chroma_db
k: 3
chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# ---- 混合检索 (Vector + BM25 + Reranker) ----
retrieval:
  dense_weight: 0.7
  sparse_weight: 0.3
  reranker_enabled: false       # bge-reranker-base ~1.1GB, 按需开启
  reranker_top_k: 10            # 送入 reranker 的候选数
  reranker_final_k: 5           # reranker 最终返回数

# ---- Embedding Worker 线程池 ----
batch_size: 32
max_workers: 4

# ---- ACGN 每日资讯知识库 ----
acgn_daily:
  collection_name: acgn_daily
  data_path: data/acgn_daily
  allow_knowledge_file_type: ["json"]

# ---- Anime 动漫知识库 ----
anime:
  collection_name: anime
  data_path: data/anime
  allow_knowledge_file_type: ["json"]

# ---- Game 游戏知识库 ----
game:
  collection_name: game
  data_path: data/game
  allow_knowledge_file_type: ["json"]

# ---- Novel 小说知识库 ----
novel:
  collection_name: novel
  data_path: data/novel
  allow_knowledge_file_type: ["json", "txt"]
