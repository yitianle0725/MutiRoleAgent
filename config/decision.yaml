# ---- LLM 层配置 ----
llm_layer:
  # 是否启用 LLM 二分类（规则不确定时使用）
  enabled: true
  # 快分类提示词
  prompt: |
    判断以下用户消息是否需要调用工具（搜索、天气、文件、推荐等）。
    仅回答 "chat"（不需要工具，纯闲聊）或 "agent"（需要工具）。
    不要输出其他任何文字。

  # LLM 层仅在以下条件触发
  # 规则层 confidence < 0.6 时才启用
  min_rule_confidence: 0.6

# ---- 缓存配置 ----
cache:
  # 同话题连续 chat 不重复判断
  # 连续 N 条消息后，自动继续 chat 模式
  chat_streak_threshold: 2
  # 缓存 TTL（秒）
  ttl_seconds: 300
  # 用户切换话题时重置（以下关键词表示话题切换）
  topic_change_signals:
    - 对了
    - 话说
    - 另外
    - 换个话题
    - 问个问题
    - 帮我
    - 我想

# ---- 监控配置 ----
monitoring:
  # 统计窗口（最近 N 条消息的 chat/agent 比例）
  stats_window: 50
