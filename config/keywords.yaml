# ---- CITA 情绪安抚短语 ----
cita_soothe:
  angry: "检测到用户情绪较为不满，请优先表达歉意和理解，安抚用户情绪后再提供解决方案。语气要诚恳、耐心，避免推卸责任。"
  urgent: "用户非常着急，请直接、高效地给出解决方案，省略不必要的背景介绍，优先给出最关键的步骤。"
  confused: "用户对产品使用存在困惑，请用简单易懂的语言逐步解释，必要时建议用户查看说明书或联系人工客服。"
  polite: "用户态度友好，保持热情专业的回应风格。"
